{% extends 'base.html' %}
{% block title %} Default Prediction {% endblock %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-heatmap@0.2.0/dist/chartjs-chart-heatmap.min.js"></script>

{% block content %}
<h1 class="text-center">Loan Default Prediction</h1>
<div class="row">
    <h1>Risk Analysis - Heatmap</h1>

    <!-- Create a canvas for the chart -->
    <canvas id="heatmap" width="800" height="400"></canvas>
    <script>
        // Load the correlation matrix data (in real usage, you would load this from the file generated in Jupyter)
        fetch('/riskAnalysis_data')
            .then(response => response.json())
            .then(cor => {
                console.log('Correlation Data:', cor); // Check if the data is fetched correctly

                const ctx = document.getElementById('heatmap').getContext('2d');
                
                // Extracting labels from the keys of the correlation matrix
                const labels = Object.keys(cor);
                console.log('Labels:', labels);  // Ensure that labels are correct

                // Mapping the data to Chart.js format
                const heatmapData = [];
                labels.forEach((label1, rowIndex) => {
                    labels.forEach((label2, colIndex) => {
                        heatmapData.push({
                            x: colIndex,
                            y: rowIndex,
                            v: cor[label1][label2]  // Use the correlation value here
                        });
                    });
                });

                // Create the heatmap
                const heatmap = new Chart(ctx, {
                    type: 'heatmap',  // Make sure the chart type is 'heatmap'
                    data: {
                        datasets: [{
                            label: 'Correlation Matrix',
                            data: heatmapData,
                            backgroundColor: function (context) {
                                const value = context.raw.v;
                                return value < 0.2 ? '#FF0000' :
                                       value < 0.4 ? '#FF6600' :
                                       value < 0.6 ? '#FFFF00' :
                                       value < 0.8 ? '#66FF00' :
                                       '#00FF00';
                            }
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                type: 'category',
                                labels: labels // X-axis labels are the features (columns)
                            },
                            y: {
                                type: 'category',
                                labels: labels // Y-axis labels are also the features (columns)
                            }
                        }
                    }
                });
            })
            .catch(err => console.error('Error fetching the correlation data:', err)); // Handle errors
    </script>
</div>
{% endblock %}
